   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Inter'; fill: #6b6b6b" transform="translate(29.272812 416.6099)">Ring 0: only me.  Ring 1: me and Charlie.  Ring 2: a project and its people.</text>
